name: Native runtime image

on:
  workflow_dispatch:

jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned libbeam and Elixir source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leostera/libbeam.git /tmp/libbeam-source
          git -C /tmp/libbeam-source fetch --depth 1 origin 5804bdacfcf7ea6878596715868c685818693baf
          git -C /tmp/libbeam-source checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/elixir-lang/elixir.git /tmp/elixir-source
          git -C /tmp/elixir-source fetch --depth 1 origin 13299af2b91a6aff7e430f25849f586c02b3231f
          git -C /tmp/elixir-source checkout --detach FETCH_HEAD

      - name: Build amd64 image from tracked sources
        env:
          LIBBEAM_SOURCE: /tmp/libbeam-source
          ELIXIR_SOURCE: /tmp/elixir-source
        run: deploy/runtime/build-image.sh

      - name: Verify image contains compiled platform and native host
        run: |
          image="midgard-runtime:${GITHUB_SHA:0:12}"
          docker run --rm --platform linux/amd64 --network none -e GITHUB_SHA --entrypoint sh "$image" -ec '
            test -x apps/libbeam_elixir/priv/libbeam_host
            elixir -e "unless System.version() == \"1.21.0-dev\", do: System.halt(1)"
            test "$MIDGARD_SOURCE_COMMIT" = "$GITHUB_SHA"
          '
