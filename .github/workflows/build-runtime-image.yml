name: Build runtime image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Midgard
        uses: actions/checkout@v4

      - name: Check out pinned libbeam source
        uses: actions/checkout@v4
        with:
          repository: leostera/libbeam
          ref: 5a8c663b819d5d24bde4fbbb7f7099385f090890
          path: libbeam

      - name: Check out pinned Elixir source
        uses: actions/checkout@v4
        with:
          repository: elixir-lang/elixir
          ref: 13299af2b91a6aff7e430f25849f586c02b3231f
          path: elixir

      - name: Set up OTP 29 and Elixir for Bazel's host tools
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Test OTP 29 BIF support in libbeam
        working-directory: libbeam
        run: >-
          bazel test
          --copt=-Wno-error=misleading-indentation
          --copt=-Wno-error=sign-compare
          --copt=-D_POSIX_C_SOURCE=200809L
          //libbeam:bif_is_integer_3_test

      - name: Build pinned runtime image
        env:
          LIBBEAM_SOURCE: ${{ github.workspace }}/libbeam
          ELIXIR_SOURCE: ${{ github.workspace }}/elixir
        run: deploy/runtime/build-image.sh

      - name: Smoke test OTP 29 shipment admission and invocation
        run: |
          set -euo pipefail
          image="midgard-runtime:${GITHUB_SHA::12}"
          container=midgard-runtime-smoke
          docker run --detach --name "$container" \
            --env MIDGARD_WORKSPACE=/tmp/midgard-platform-smoke \
            "$image"
          trap 'docker rm --force "$container" >/dev/null' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" elixir -e '
              :inets.start()
              case :httpc.request(:get, {~c"http://127.0.0.1:4000/", []}, [], body_format: :binary) do
                {:ok, {{_, 200, _}, _, _}} -> System.halt(0)
                _ -> System.halt(1)
              end
            ' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          docker exec --workdir /opt/midgard/examples/hello_worker \
            --env MIX_ENV=dev "$container" sh -ec '
              mix deps.get
              mix midgard.deploy --endpoint http://127.0.0.1:4000
            '
          docker exec "$container" elixir -e '
            :inets.start()
            case :httpc.request(:get, {~c"http://127.0.0.1:4000/run/hello_worker/hello?name=OTP29", []}, [], body_format: :binary) do
              {:ok, {{_, 200, _}, _, "Hello, OTP29!\n"}} -> :ok
              other -> IO.inspect(other); System.halt(1)
            end
          '

      - name: Export runtime image
        run: docker save "midgard-runtime:${GITHUB_SHA::12}" | gzip -1 > midgard-runtime.tar.gz

      - name: Upload runtime image artifact
        uses: actions/upload-artifact@v4
        with:
          name: midgard-runtime-${{ github.sha }}
          path: midgard-runtime.tar.gz
          retention-days: 1
